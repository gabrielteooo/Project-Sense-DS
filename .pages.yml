# Full component page CMS (pageFormatVersion 2). Multiple file entries edit the same JSON; merge preserves other keys.
# Handbook fixed headings: Design (Anatomy + coded spec for Button), Usage (Guideline, Usage), Updates (Updates, Roadmap).

settings:
  content:
    merge: true

media:
  - name: docs_images
    label: Documentation images
    input: handbook/public/images/docs
    output: /images/docs/
    categories: [image]
    extensions: [png, jpg, jpeg, webp, gif]
    rename: safe

components:
  sectionId:
    type: string
    label: Section ID
    description: Stable lowercase ID (letters, numbers, hyphens). Do not rename after publishing.

  componentPageImage:
    type: object
    label: Diagram image
    fields:
      - name: src
        label: Image file
        type: image
        options:
          media: docs_images
      - name: alt
        label: Alternative text
        type: string
        required: true
      - name: caption
        label: Caption (optional)
        type: text

  componentPageFigureSection:
    type: object
    label: Figure section
    fields:
      - name: id
        component: sectionId
      - name: title
        label: Section title
        type: string
        required: true
      - name: description
        label: Description (optional)
        type: text
      - name: image
        component: componentPageImage
        label: Diagram

  buttonDesignTab:
    type: object
    label: Design tab content
    fields:
      - name: anatomyImage
        label: Anatomy — diagram
        description: The handbook always shows the heading **Anatomy** above this image.
        component: componentPageImage
      - name: anatomyRichText
        label: Anatomy — text below diagram
        description: Markdown shown under the anatomy image (parts list, notes).
        type: rich-text
        options:
          format: markdown
          media: false
          switcher: true
      - name: sections
        label: Figure sections
        description: Optional titled diagrams after Anatomy. Specification guidelines on the Button page are maintained in code, not in the CMS.
        component: componentPageFigureSection
        list:
          collapsible:
            collapsed: true
            summary: "{title}"

  buttonUsageTab:
    type: object
    label: Usage tab content
    fields:
      - name: guidelineRichText
        label: Guideline — body
        description: The handbook always shows the heading **Guideline** above this text (Markdown).
        type: rich-text
        options:
          format: markdown
          media: false
          switcher: true
      - name: usageRichText
        label: Usage — body
        description: The handbook always shows the heading **Usage**, then a divider, then any sections below.
        type: rich-text
        options:
          format: markdown
          media: false
          switcher: true
      - name: sections
        label: Additional figure sections (after divider)
        component: componentPageFigureSection
        list:
          collapsible:
            collapsed: true
            summary: "{title}"

  buttonUpdatesTab:
    type: object
    label: Updates tab content
    fields:
      - name: changelogRichText
        label: Updates — body
        description: The handbook always shows the heading **Updates** above this text (Markdown). Use a table for changelog entries if you like.
        type: rich-text
        options:
          format: markdown
          media: false
          switcher: true
      - name: roadmapRichText
        label: Roadmap — body
        description: The handbook always shows the heading **Roadmap** above this text (Markdown).
        type: rich-text
        options:
          format: markdown
          media: false
          switcher: true

  tabsDesignWrapper:
    type: object
    fields:
      - name: design
        component: buttonDesignTab

  tabsUsageWrapper:
    type: object
    fields:
      - name: usage
        component: buttonUsageTab

  tabsUpdatesWrapper:
    type: object
    fields:
      - name: updates
        component: buttonUpdatesTab

content:
  - name: handbook-components
    label: Handbook components
    type: group
    items:
      - name: component-page-template
        label: Page template (reference)
        type: file
        path: handbook/content/components/_template.component.page.json
        format: json
        fields:
          - name: pageTitle
            type: string
            readonly: true
          - name: pageDescription
            type: text
            readonly: true

      - name: button-page
        label: Button page
        type: group
        items:
          - name: button-header
            label: Header
            type: file
            path: handbook/content/components/button.json
            format: json
            fields:
              - name: pageTitle
                label: Page title
                type: string
              - name: pageDescription
                label: Page subtitle
                type: string
              - name: pageFormatVersion
                type: number
                hidden: true
                readonly: true
              - name: slug
                type: string
                hidden: true
                readonly: true

          - name: button-design
            label: Design tab
            type: file
            path: handbook/content/components/button.json
            format: json
            fields:
              - name: pageFormatVersion
                type: number
                hidden: true
                readonly: true
              - name: tabs
                component: tabsDesignWrapper
                label: Design tab

          - name: button-usage
            label: Usage tab
            type: file
            path: handbook/content/components/button.json
            format: json
            fields:
              - name: pageFormatVersion
                type: number
                hidden: true
                readonly: true
              - name: tabs
                component: tabsUsageWrapper
                label: Usage tab

          - name: button-updates
            label: Updates tab
            type: file
            path: handbook/content/components/button.json
            format: json
            fields:
              - name: pageFormatVersion
                type: number
                hidden: true
                readonly: true
              - name: tabs
                component: tabsUpdatesWrapper
                label: Updates tab
