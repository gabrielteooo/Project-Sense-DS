# Pages CMS — Button component pilot with reusable documentation blocks.
# settings.content.merge preserves design/usage showcases and other JSON not listed here.

settings:
  content:
    merge: true

media:
  - name: docs_images
    label: Documentation images
    input: handbook/public/images/docs
    output: /images/docs/
    categories: [image]
    extensions: [png, jpg, jpeg, webp, gif]
    rename: safe

components:
  docBlockId:
    type: string
    label: Block ID
    description: >-
      Stable lowercase ID (letters, numbers, hyphens). Used in the handbook and for CMS list summaries —
      do not change after publishing.

  usageGuidelinesLegacy:
    type: object
    label: Guideline bullets (legacy section)
    fields:
      - name: title
        label: Section heading
        type: string
        description: Usually “Guideline”.
      - name: bullets
        label: Bullet points
        type: text
        list: true
        description: Short writing tips shown above the CMS pilot section.

content:
  - name: handbook-components
    label: Handbook components
    type: group
    items:
      - name: button-page
        label: Button
        type: file
        path: handbook/content/components/button.json
        format: json
        fields:
          - name: pageTitle
            label: Page title
            type: string
            description: Main title on the Button page (browser tab and hero).
          - name: pageDescription
            label: Page subtitle
            type: string
            description: One short line explaining when to use a button.
          - name: usage
            type: object
            label: Usage tab (partial)
            description: >-
              Edits the guideline bullets and the CMS pilot block stack. Interactive showcases, design
              tab, and updates tab stay in the file automatically (merge mode).
            fields:
              - name: guidelines
                component: usageGuidelinesLegacy
                label: Guideline bullets
              - name: cmsPilot
                type: object
                label: CMS documentation blocks (pilot)
                fields:
                  - name: sectionTitle
                    label: Section heading
                    type: string
                    description: Title above the block list on the Usage tab.
                  - name: blocks
                    label: Blocks
                    type: block
                    blockKey: type
                    description: Add or reorder blocks. Each block needs a stable Block ID.
                    list:
                      collapsible:
                        collapsed: true
                        summary: "{id}"
                    blocks:
                      - name: richText
                        label: Rich text
                        fields:
                          - name: id
                            component: docBlockId
                          - name: title
                            label: Optional heading
                            type: string
                          - name: body
                            label: Body
                            type: rich-text
                            description: Formatted text (stored as Markdown).
                            options:
                              format: markdown
                              media: docs_images
                              switcher: true
                      - name: image
                        label: Image
                        fields:
                          - name: id
                            component: docBlockId
                          - name: title
                            label: Optional heading
                            type: string
                          - name: src
                            label: Image file
                            type: image
                            required: true
                            options:
                              media: docs_images
                          - name: alt
                            label: Alternative text
                            type: string
                            required: true
                            description: Required for accessibility — describe what the image shows.
                          - name: caption
                            label: Caption (optional)
                            type: text
                      - name: table
                        label: Table
                        fields:
                          - name: id
                            component: docBlockId
                          - name: title
                            label: Optional heading
                            type: string
                          - name: columns
                            label: Column headings
                            type: string
                            list: true
                            description: Define headings first; each row must have the same number of cells.
                          - name: rows
                            label: Rows
                            type: object
                            list: true
                            fields:
                              - name: cells
                                label: Row cells
                                type: string
                                list: true
                      - name: doDont
                        label: Do / Don't comparison
                        fields:
                          - name: id
                            component: docBlockId
                          - name: title
                            label: Optional heading
                            type: string
                          - name: pairs
                            label: Do and don't pairs
                            type: object
                            list:
                              min: 1
                              collapsible:
                                collapsed: true
                                summary: "Pair {index}"
                            fields:
                              - name: do
                                label: Do
                                type: text
                              - name: dont
                                label: Don't
                                type: text
                      - name: callout
                        label: Callout
                        fields:
                          - name: id
                            component: docBlockId
                          - name: variant
                            label: Callout type
                            type: select
                            options:
                              values:
                                - name: information
                                  label: Information
                                - name: warning
                                  label: Warning
                          - name: title
                            label: Callout title (optional)
                            type: string
                          - name: body
                            label: Message
                            type: rich-text
                            options:
                              format: markdown
                              media: false
                              switcher: true
                      - name: interactiveExample
                        label: Interactive example
                        description: >-
                          Embeds a registered handbook demo. You cannot paste code — choose from the list.
                        fields:
                          - name: id
                            component: docBlockId
                          - name: title
                            label: Optional heading
                            type: string
                          - name: demoId
                            label: Demo to show
                            type: select
                            required: true
                            options:
                              values:
                                - name: button-primary-showcase
                                  label: Primary button examples
                                - name: button-secondary-showcase
                                  label: Secondary button examples
                                - name: button-tertiary-showcase
                                  label: Tertiary button examples
